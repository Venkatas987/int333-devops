# k8s/hpa.yaml
# WHY: A HorizontalPodAutoscaler (HPA) automatically scales the number of pods
# up when CPU is high and back down when it's idle.
# Without HPA, you'd have to manually increase replicas during traffic spikes.
#
# This HPA keeps 2–6 pods and scales when average CPU across all pods > 70%.
# autoscaling/v2 (stable since k8s 1.23) supports multiple metrics and behaviour tuning.

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: myapp
  labels:
    app: myapp
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: myapp          # Must match the Deployment name.

  # WHY min=2: always keep at least 2 pods for high availability.
  minReplicas: 2
  maxReplicas: 6

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          # Scale up when average CPU across all pods exceeds 70%.
          averageUtilization: 70
