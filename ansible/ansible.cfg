# ansible/ansible.cfg
#
# WHY THIS FILE EXISTS:
# ansible.cfg sets defaults for every ansible command in this project.
# Without it you'd have to pass --inventory, --become, and --private-key
# on the command line every time.
#
# This file is read automatically when you run ansible commands from
# the ansible/ directory.

[defaults]
# Where to find the inventory (generated by Terraform).
inventory          = inventory/hosts.ini

# Where Ansible looks for roles (common, k3s, app, nagios_server).
roles_path         = roles

# Where Ansible looks for collections (e.g. community.general).
collections_path   = ~/.ansible/collections:~/.ansible/collections/ansible_collections

# Don't check SSH host keys – new AWS instances have unknown fingerprints.
# WHY: on a first connection Ansible would pause and ask "Are you sure?".
# For production, enable this and pre-populate known_hosts.
host_key_checking  = False

# Run all tasks as root (via sudo) by default.
become             = True

# Use the YAML output plugin – much more readable than the default.
stdout_callback    = yaml

# Increase the default timeout to handle slow cloud instances.
timeout            = 60

[ssh_connection]
# Persist the SSH connection between tasks in the same play (faster).
pipelining = True
