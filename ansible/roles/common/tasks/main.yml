---
# ansible/roles/common/tasks/main.yml
#
# WHY THIS ROLE EXISTS:
# Every server in our fleet needs a secure, consistent baseline before
# we install anything specific (k3s, Nagios).
# This role is idempotent – running it twice has the same result as running it once.
#
# Tasks:
#   1. Update apt cache (so we install the latest packages)
#   2. Install essential packages
#   3. Harden SSH (disable root login and password auth)
#   4. Ensure chrony (time sync) is running

# ── 1. Update the apt package cache ──────────────────────────────────────────
# WHY: Without an up-to-date cache, apt might install old or unavailable versions.
# BUG FIX B4: lock_timeout added to all apt tasks.  On a fresh EC2 instance,
# `unattended-upgrades` may hold the apt lock for 1-2 minutes after boot.
# 180 seconds is enough for it to finish without failing the playbook.
- name: Update apt package cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600   # Only update if the cache is older than 1 hour.
    lock_timeout: 180
  tags: [common]

# ── 2. Install essential packages ────────────────────────────────────────────
- name: Install essential packages
  ansible.builtin.apt:
    name:
      - curl
      - git
      - htop
      - ufw
      - unattended-upgrades   # Automatically installs security updates.
      - chrony                 # Network Time Protocol daemon (accurate clocks matter for TLS).
      - python3-pip            # Needed for some Ansible modules.
    state: present
    lock_timeout: 180   # B4: wait up to 3 min for apt lock on fresh servers
  tags: [common]

# ── 3. Harden SSH configuration ──────────────────────────────────────────────
# WHY: The default Ubuntu SSH config allows password authentication.
# Disabling it forces key-based auth, which is much harder to brute-force.
- name: Harden SSH - disable root login
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PermitRootLogin'
    line: 'PermitRootLogin no'
    validate: '/usr/sbin/sshd -t -f %s'   # Validate before saving – prevents locking yourself out.
  notify: Restart sshd
  tags: [common]

- name: Harden SSH - disable password authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PasswordAuthentication'
    line: 'PasswordAuthentication no'
    validate: '/usr/sbin/sshd -t -f %s'
  notify: Restart sshd
  tags: [common]

# ── 4. Ensure chrony is running ───────────────────────────────────────────────
# WHY: If clocks drift, TLS certificates may be rejected and Nagios timestamps
# become unreliable.
- name: Ensure chrony time sync service is running and enabled
  ansible.builtin.service:
    name: chrony
    state: started
    enabled: true
  tags: [common]

# ── 5. Set system hostname ───────────────────────────────────────────────────
# WHY: EC2 default hostnames are ip-*. Setting explicit hostnames (app-staging-1,
# monitor-staging-1) ensures Puppet's node regex (/^app/) and custom function
# baseline::env_label properly identify the server and its environment.
- name: Set system hostname
  ansible.builtin.hostname:
    name: "{{ 'app-' + (env_name | default('staging')) + '-1' if 'app' in group_names else 'monitor-' + (env_name | default('staging')) + '-1' }}"
  tags: [common]

# ── 6. Ensure hostname resolves locally ───────────────────────────────────────
# WHY: Debian/Ubuntu conventions use 127.0.1.1 for local FQDN/hostname resolution.
# Ensuring the new hostname is in /etc/hosts prevents sudo warnings ("unable to
# resolve host") and allows local services to resolve the system hostname.
- name: Ensure hostname resolves locally in /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1'
    line: "127.0.1.1 {{ 'app-' + (env_name | default('staging')) + '-1' if 'app' in group_names else 'monitor-' + (env_name | default('staging')) + '-1' }}"
    state: present
  tags: [common]
