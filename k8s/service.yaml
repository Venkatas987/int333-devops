# k8s/service.yaml
# WHY: A Service gives the Deployment a stable internal DNS name and IP address.
# Without a Service, pods can only be reached by their short-lived pod IPs,
# which change every time a pod restarts.
#
# Type ClusterIP: only reachable inside the cluster.
# The Ansible role patches this to NodePort so external traffic can reach it.

apiVersion: v1
kind: Service
metadata:
  name: myapp
  labels:
    app: myapp
spec:
  # ClusterIP: the default – assigns a virtual IP inside the cluster only.
  # Ansible will patch this to NodePort 30080 so the load balancer / your
  # browser can reach the app.  See roles/app/tasks/main.yml.
  type: ClusterIP

  selector:
    # Must match the pod label set in deployment.yaml.
    app: myapp

  ports:
    - name: http
      protocol: TCP
      port: 80          # Port on the Service (what callers use inside the cluster)
      targetPort: 3000  # Port on the container (what server.js listens on)
